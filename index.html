<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pendeteksi Sampah</title>

<style>
body{
    background:#04102d;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    color:#31b9ff;
    margin-top:50px;
    font-size:55px;
}

button{
    background:#22b8ff;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
    margin:20px;
}

button:hover{
    opacity:0.8;
}

#status{
    font-size:30px;
    font-weight:bold;
}

.kamera-box{
    width:800px;
    height:450px;
    border:4px solid #22b8ff;
    margin:auto;
    border-radius:20px;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}
</style>

</head>
<body>

<h1>♻ AI Pendeteksi Sampah</h1>
<h2>By Ica Nuralija</h2>

<button id="btnKamera">
AKTIFKAN KAMERA
</button>

<p id="status">
STATUS : BELUM AKTIF
</p>

<div class="kamera-box">
    <video id="video" autoplay playsinline></video>
</div>

<script src="app.js"></script>

</body>
</html>
