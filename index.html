<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Kamera</title>

    <style>

        body{

            background:#0f172a;
            color:white;
            font-family:Arial;
            text-align:center;
            padding:20px;
        }

        h1{

            color:#38bdf8;
        }

        .container{

            position:relative;

            width:640px;

            height:480px;

            margin:auto;

            border:3px solid #38bdf8;

            border-radius:15px;

            overflow:hidden;
        }

        video,
        canvas{

            position:absolute;

            top:0;

            left:0;

            width:100%;

            height:100%;
        }

        #overlay{

            z-index:10;
        }

        button{

            margin:20px;

            padding:12px 25px;

            border:none;

            border-radius:10px;

            background:#0ea5e9;

            color:white;

            font-weight:bold;

            cursor:pointer;
        }

        #status{

            margin-bottom:15px;

            font-weight:bold;
        }

    </style>

</head>

<body>

    <h1>♻️ AI Pendeteksi Sampah</h1>

    <p>By Ica Nuralija</p>

    <button id="btn-init">

        AKTIFKAN KAMERA

    </button>

    <div id="status">

        STATUS : BELUM AKTIF

    </div>

    <div class="container">

        <video id="webcam"
               autoplay
               playsinline
               muted>
        </video>

        <canvas id="overlay"
                width="640"
                height="480">
        </canvas>

    </div>

    <script src="app.js"></script>

</body>

</html>
